  const input = $("#searchInput");
  const q = input ? input.value.trim().toLowerCase() : "";
  return VIDEO_LIBRARY.filter(v => {
    const catOk = currentCategory === "all" || v.category === currentCategory;
    const text = (loc(v.title) + " " + (v.category || "")).toLowerCase();
    return catOk && text.indexOf(q) !== -1;
  });
}

function createCard(v) {
  const title = loc(v.title);
  const cover = v.cover || "";
  return '<article class="card" data-id="' + v.id + '">' +
    '<div class="cover">' +
      (cover ? '<img src="' + cover + '" alt="' + title + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><div class="cover-placeholder" style="display:none">v000.webp</div>' : '<div class="cover-placeholder">无封面</div>') +
      (v.live ? '<div class="live-badge"><div class="live-dot"></div>LIVE</div>' : '') +
      '<div class="duration">' + (v.duration || '') + '</div>' +
    '</div>' +
    '<div class="card-info">' +
      '<h3>' + title + '</h3>' +
      '<div class="card-meta">' +
        '<span>👁 ' + (v.views || '0') + '</span>' +
        '<button class="dl-btn" data-id="' + v.id + '">' + t("dl") + '</button>' +
      '</div>' +
    '</div>' +
  '</article>';
}

function render() {
  try {
    const list = visible();
    const box = $("#content");
    if (!box) return;
    box.innerHTML = "";

    const empty = $("#empty");
    if (!list || list.length === 0) {
      if (empty) empty.style.display = "block";
      return;
    }
    if (empty) empty.style.display = "none";

    const order = [
      {cat: "live", title: t("live")},
      {cat: "ai", title: t("ai")},
      {cat: "anime", title: t("anime")},
      {cat: "other", title: "热门"}
    ];

    order.forEach(function(g) {
      let items = [];
      if (currentCategory !== "all") {
        if (g.cat !== currentCategory && !(g.cat === "other" && ["europe","asian","homemade","lesbian","threesome","anal","longlegs"].indexOf(currentCategory) !== -1)) return;
        items = list;
      } else {
        if (g.cat === "other") {
          items = list.filter(function(v) { return ["live","ai","anime"].indexOf(v.category) === -1; });
        } else {
          items = list.filter(function(v) { return v.category === g.cat; });
        }
      }
      if (!items.length) return;

      const sec = document.createElement("div");
      sec.innerHTML = '<div class="sec-title">' + g.title + ' <span>' + items.length + '</span></div>' +
                      '<div class="grid">' + items.map(createCard).join("") + '</div>';
      box.appendChild(sec);
    });
  } catch (err) {
    console.error("render error:", err);
  }
}

function download(id) {
  const a = document.createElement("a");
  a.href = DOWNLOAD_API_BASE;
  a.target = "_blank";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function openCenter() {
  const list = $("#dlgList");
  if (!list) return;
  list.innerHTML = "";
  VIDEO_LIBRARY.forEach(function(v) {
    const div = document.createElement("div");
    div.className = "dlg-item";
    div.innerHTML = "<span>" + loc(v.title) + "</span>";
    const btn = document.createElement("button");
    btn.textContent = t("dl");
    btn.onclick = function() { download(v.id); };
    div.appendChild(btn);
    list.appendChild(div);
  });
  const dlg = $("#dlDialog");
  if (dlg) dlg.showModal();
}

document.addEventListener("DOMContentLoaded", function() {
  const content = $("#content");
  if (content) {
    content.addEventListener("click", function(e) {
      const btn = e.target.closest(".dl-btn");
      const card = e.target.closest(".card");
      if (btn) { download(btn.getAttribute("data-id")); return; }
      if (card) download(card.getAttribute("data-id"));
    });
  }

  const cats = $("#cats");
  if (cats) {
    cats.addEventListener("click", function(e) {
      const btn = e.target.closest(".cat");
      if (!btn) return;
      currentCategory = btn.getAttribute("data-category");
      document.querySelectorAll(".cat").forEach(function(c) {
        c.classList.toggle("active", c === btn);
      });
      render();
    });
  }

  const search = $("#searchInput");
  if (search) search.addEventListener("input", render);

  const langSel = $("#languageSelect");
  if (langSel) langSel.addEventListener("change", function(e) { setLang(e.target.value); });

  const bigBtn = $("#bigDownload");
  if (bigBtn) bigBtn.addEventListener("click", openCenter);

  const closeBtn = $("#closeDlg");
  if (closeBtn) closeBtn.addEventListener("click", function() {
    const dlg = $("#dlDialog");
    if (dlg) dlg.close();
  });

  const dlg = $("#dlDialog");
  if (dlg) {
    dlg.addEventListener("click", function(e) {
      if (e.target === dlg) dlg.close();
    });
  }

  let pref = "auto";
  try { pref = localStorage.getItem("wqj-lang") || "auto"; } catch(e) {}
  setLang(pref);

  setInterval(function() {
    const base = 14340;
    const n = base + Math.floor(Math.random() * 80 - 40);
    const el = $("#onlineCount");
    if (el) el.textContent = t("online") + n.toLocaleString();
  }, 4000);
});
</script>
</body>
</html>
