  color: var(--muted);
  font-size: 13px;

  white-space: nowrap;

.pill:hover, .pill.active {

  border-color: var(--accent);
  color: #fff;
  font-weight: 600;

.toolbar {

  justify-content: space-between;

.section-head h2 {

  font-weight: 700;

.count { color: var(--muted); font-size: 13px; }

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px)  { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
@media (max-width: 420px)  { .grid { grid-template-columns: 1fr; } }

/* Card */
.card {

  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform .2s, border-color .2s;
  cursor: pointer;

}
.cover {
  position: relative;

  background: #1a1a1e;

}

  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;

}
.card:hover .cover img { transform: scale(1.05); }
.cover-placeholder {

let currentCategory = "all";
let currentLanguage = "zh-CN";

const $ = s => document.querySelector(s);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function normalizeLanguage(raw) {
  if (!raw) return "en";
  const value = raw.replace("_", "-");
  const lower = value.toLowerCase();
  if (lower === "zh-tw" || lower === "zh-hk" || lower === "zh-hant") return "zh-TW";
  if (lower === "zh" || lower.startsWith("zh-")) return "zh-CN";
  const base = lower.split("-")[0];
  return ["en", "zh-CN", "zh-TW", "ja", "ko"].includes(base) ? base : "en";
}

function detectLanguage() {
  const choices = navigator.languages?.length ? navigator.languages : [navigator.language || "en"];
  for (const lang of choices) {
    const normalized = normalizeLanguage(lang);
    if (["en", "zh-CN", "zh-TW", "ja", "ko"].includes(normalized)) return normalized;
  }
  return "zh-CN";
}

function localizedText(value) {
  if (typeof value === "string") return value;
  if (!value || typeof value !== "object") return "";
  return value[currentLanguage] || value.en || value["zh-CN"] || Object.values(value)[0] || "";
}

function setLanguage(choice, save = true) {
  currentLanguage = choice === "auto" ? detectLanguage() : normalizeLanguage(choice);
  document.documentElement.lang = currentLanguage;
  if (save) {
    try { localStorage.setItem("preferred-language", choice); } catch (e) {}

  $("#languageSelect").value = choice;
  renderVideos();
}

      localizedText(video.description),
      video.category
    ].join(" ").toLowerCase();
    return categoryMatch && searchable.includes(query);
  });
}

  link.target = "_blank";

  link.click();
  link.remove();
