let currentCategory = "all";
let currentLanguage = "zh-CN";

const $ = s => document.querySelector(s);

function escapeHTML(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function normalizeLanguage(raw) {
  if (!raw) return "zh-CN";
  const lower = raw.toLowerCase().replace("_", "-");
  if (lower === "zh-tw" || lower === "zh-hk" || lower === "zh-hant") return "zh-TW";
  if (lower.startsWith("zh")) return "zh-CN";
  if (lower.startsWith("ja")) return "ja";
  if (lower.startsWith("ko")) return "ko";
  if (lower.startsWith("en")) return "en";
  return "zh-CN";
}

function detectLanguage() {
  const langs = navigator.languages?.length ? navigator.languages : [navigator.language || "zh-CN"];
  for (const l of langs) {
    const n = normalizeLanguage(l);
    if (I18N[n]) return n;
  }
  return "zh-CN";
}

function t(key) {
  return I18N[currentLanguage]?.[key] || I18N["zh-CN"][key] || key;
}

function localizedText(value) {
  if (typeof value === "string") return value;
  if (!value || typeof value !== "object") return "";
  return value[currentLanguage] || value["zh-CN"] || value.en || Object.values(value)[0] || "";
}

function setLanguage(choice, save = true) {
  currentLanguage = choice === "auto" ? detectLanguage() : normalizeLanguage(choice);
  document.documentElement.lang = currentLanguage;
  if (save) try { localStorage.setItem("preferred-language", choice); } catch(e){}
  $("#languageSelect").value = choice;

  // 更新所有带 data-i18n 的元素
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  renderVideos();
}

function visibleVideos() {
  const q = $("#searchInput").value.trim().toLowerCase();
  return VIDEO_LIBRARY.filter(v => {
    const catOk = currentCategory === "all" || v.category === currentCategory;
    const text = (localizedText(v.title) + " " + localizedText(v.description)).toLowerCase();
    return catOk && text.includes(q);
  });
}

function createCard(video) {
  const title = escapeHTML(localizedText(video.title));
  const cover = escapeHTML(video.cover || "");
  return `
    <article class="card" data-id="${escapeHTML(video.id)}">
      <div class="cover">
        ${cover ? `<img src="${cover}" alt="${title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="cover-placeholder" style="display:none">无封面</div>` : `<div class="cover-placeholder">无封面</div>`}
        <span class="duration">${escapeHTML(video.duration || "")}</span>
      </div>
      <div class="card-body">
        <h3>${title}</h3>
        <div class="meta">
          <span class="views">👁 ${escapeHTML(video.views || "0")}</span>
          <button class="action-btn" type="button" data-action="download" data-id="${escapeHTML(video.id)}">${t("downloadCenter")}</button>
        </div>
      </div>
    </article>`;
}

function renderVideos() {
  const videos = visibleVideos();
  const sections = $("#sections");
  sections.innerHTML = "";

  if (!videos.length) {
    $("#emptyState").style.display = "block";
    return;
  }
  $("#emptyState").style.display = "none";

  // 按大类分组显示
  const groups = [
    { key: "popular", cats: ["europe","asian","longlegs","homemade","threesome","lesbian","anal"], title: t("popular") },
    { key: "ai", cats: ["ai"], title: t("aiSection") },
    { key: "anime", cats: ["anime"], title: t("animeSection") },
    { key: "live", cats: ["live"], title: t("liveSection") }
  ];

  groups.forEach(g => {
    const list = videos.filter(v => g.cats.includes(v.category) || (currentCategory !== "all" && g.cats.includes(currentCategory)));
    if (currentCategory !== "all") {
      // 单一分类时只显示对应内容
      if (!g.cats.includes(currentCategory) && !(currentCategory === "all")) return;
    }
    const filtered = currentCategory === "all" ? videos.filter(v => g.cats.includes(v.category)) : videos;
    if (!filtered.length) return;

    const section = document.createElement("section");
    section.className = "section";
    section.innerHTML = `
      <div class="section-head">
        <h2>${escapeHTML(g.title)}</h2>
        <span class="count">${filtered.length} ${currentLanguage.startsWith("zh") ? "个视频" : "videos"}</span>
      </div>
      <div class="grid">${filtered.map(createCard).join("")}</div>`;
    sections.appendChild(section);
  });
}

function findVideo(id) { return VIDEO_LIBRARY.find(v => v.id === id); }

function downloadVideo(video) {
  if (!DOWNLOAD_API_BASE) {
    alert(currentLanguage.startsWith("zh") ? "请先设置 DOWNLOAD_API_BASE 为你的下载API地址" : "Please set DOWNLOAD_API_BASE first");
    return;
  }
  const url = DOWNLOAD_API_BASE + encodeURIComponent(video.id);
  const a = document.createElement("a");
  a.href = url;
  a.download = video.downloadName || video.id + ".mp4";
  a.target = "_blank";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function openDownloadCenter() {
  const list = $("#downloadList");
  list.innerHTML = "";
  VIDEO_LIBRARY.forEach(video => {
    const item = document.createElement("div");
    item.className = "download-item";
    const title = document.createElement("span");
    title.textContent = localizedText(video.title);
    const a = document.createElement("a");
    a.href = "#";
    a.textContent = t("downloadCenter");
    a.addEventListener("click", e => { e.preventDefault(); downloadVideo(video); });
    item.append(title, a);
    list.appendChild(item);
  });
  $("#downloadsDialog").showModal();
}

/* 事件 */
$("#sections").addEventListener("click", e => {
  const btn = e.target.closest("button[data-action]");
  const card = e.target.closest(".card");
  if (btn) {
    const v = findVideo(btn.dataset.id);
    if (v) downloadVideo(v);
    return;
  }
  if (card) {
    const v = findVideo(card.dataset.id);
    if (v) downloadVideo(v);
  }
});

$("#pills").addEventListener("click", e => {
  const btn = e.target.closest("button[data-category]");
  if (!btn) return;
  currentCategory = btn.dataset.category;
  document.querySelectorAll(".pill").forEach(p => p.classList.toggle("active", p === btn));
  renderVideos();
});

$("#searchInput").addEventListener("input", renderVideos);
$("#languageSelect").addEventListener("change", e => setLanguage(e.target.value, true));
$("#downloadCenter").addEventListener("click", openDownloadCenter);
$("#floatDownload").addEventListener("click", openDownloadCenter);
$("#closeDownloads").addEventListener("click", () => $("#downloadsDialog").close());
$("#downloadsDialog").addEventListener("click", e => {
  if (e.target === $("#downloadsDialog")) $("#downloadsDialog").close();
});

$("#year").textContent = new Date().getFullYear();

// 自动语言
let preferred = "auto";
try { preferred = localStorage.getItem("preferred-language") || "auto"; } catch(e){}
setLanguage(preferred, false);
</script>
