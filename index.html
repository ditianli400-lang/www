<style>
*{
box-sizing:border-box;
}
body{
margin:0;
background:#050914;
font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;

.mobile{
width:100%;
max-width:430px;
min-height:100vh;

/* 首頁 */

}
.timer{

}
.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:12px;
padding-bottom:100px;
}
.card{
background:#1e293b;
border-radius:15px;
overflow:hidden;
position:relative;
}
.online-tag{
position:absolute;
top:10px;
left:10px;
z-index:5;
background:#f59e0b;
color:white;
padding:5px 9px;
border-radius:8px;
font-size:12px;
font-weight:bold;
}
.card img{
width:100%;
height:210px;
object-fit:cover;
}
.info{
padding:10px;
}
.name{
font-size:17px;
font-weight:bold;
}
.location{
font-size:12px;
color:#fda4af;
margin-top:5px;
}
.views{
font-size:12px;
color:#94a3b8;
margin-top:5px;
}
.btn{
width:90%;
margin:10px 5%;
padding:12px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#3b82f6,#a855f7);
color:white;
font-size:14px;
}
/* 解鎖按鈕 */
.unlock-bar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:390px;
padding:16px;
background:#00c853;
border-radius:30px;
text-align:center;
font-size:18px;
font-weight:bold;
z-index:999;
}
/* 聊天頁 */
.chat-page{
display:none;
min-height:100vh;
background:#101827;
}
.chat-header{
display:flex;
align-items:center;
gap:12px;
padding:15px;
border-bottom:1px solid #334155;
}
.back{
background:none;
border:none;
color:white;
font-size:25px;
}
.avatar{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
}
.chat-name{
font-size:18px;
font-weight:bold;
}
.messages{
padding:20px;
min-height:70vh;
}
.msg{
background:#273449;
padding:14px;
border-radius:18px;
margin-bottom:15px;
font-size:14px;
}
.chat-bottom{
position:fixed;
bottom:20px;
width:100%;
max-width:430px;
padding:0 20px;
}
.chat-bottom button{
width:100%;
padding:16px;
border:none;
border-radius:30px;
background:#00c853;
color:white;
font-size:18px;
font-weight:bold;
}
/* 底部聲明 */
.footer{
padding:30px 20px 90px;
font-size:12px;
line-height:1.8;
color:#94a3b8;
}
.footer-title{
text-align:center;
font-size:14px;
color:#cbd5e1;
}
.footer-line{
height:1px;
background:#334155;
margin:15px 0;
}
.footer-links{
text-align:center;
margin-top:20px;
}
.footer-links a{
color:#94a3b8;
text-decoration:none;
margin:0 8px;
}
.footer-links span{
color:#475569;
}
</style>

</div>
<button class="btn">

</button>
`;
card.onclick=()=>{
openChat(index);
};
list.appendChild(card);
});
function openChat(index){
let user=users[index];
document.getElementById("home").style.display="none";
document.getElementById("chat").style.display="block";
document.getElementById("chatAvatar").src=user.img;
document.getElementById("chatName").innerHTML=user.name;
let box=document.getElementById("messages");
box.innerHTML="";
user.messages.forEach(text=>{
let div=document.createElement("div");
div.className="msg";
div.innerHTML=text;
box.appendChild(div);
});
}
function backHome(){
document.getElementById("chat").style.display="none";
document.getElementById("home").style.display="block";
}
function unlockInfo(){
goLine();
}
function goLine(){
let url = linePool[lineIndex];
// 下一次換下一個
lineIndex++;
if(lineIndex >= linePool.length){
lineIndex = 0;
}
// 跳轉LINE
window.location.href=url;
}
