  ja: { all:"すべて", live:"ライブ", ai:"AI", anime:"アニメ", europe:"欧米", asian:"アジア", homemade:"素人", lesbian:"レズ", threesome:"3P", anal:"アナル", longlegs:"美脚", search:"検索...", empty:"動画なし", dl:"ダウンロード", big:"↓ ダウンロードして無料視聴", tip:"100%無料 · 登録不要", online:"オンライン ", center:"ダウンロード" },
  ko: { all:"전체", live:"라이브", ai:"AI", anime:"애니", europe:"서양", asian:"아시아", homemade:"홈메이드", lesbian:"레즈", threesome:"쓰리섬", anal:"애널", longlegs:"롱레그", search:"검색...", empty:"영상 없음", dl:"다운로드", big:"↓ 다운로드 후 무료 시청", tip:"100% 무료 · 가입 불필요", online:"온라인 ", center:"다운로드" }
};

let currentCategory = "all";
let currentLanguage = "zh-CN";
const $ = s => document.querySelector(s);

function t(key) { return I18N[currentLanguage]?.[key] || I18N["zh-CN"][key] || key; }
function loc(obj) {
  if (typeof obj === "string") return obj;
  return obj?.[currentLanguage] || obj?.["zh-CN"] || obj?.en || Object.values(obj||{})[0] || "";
}
function normalizeLang(raw) {
  if (!raw) return "zh-CN";
  const l = raw.toLowerCase();
  if (l.includes("zh-tw") || l.includes("zh-hk") || l.includes("hant")) return "zh-TW";
  if (l.startsWith("zh")) return "zh-CN";
  if (l.startsWith("ja")) return "ja";
  if (l.startsWith("ko")) return "ko";
  if (l.startsWith("en")) return "en";
  return "zh-CN";
}
function detectLang() {
  const list = navigator.languages || [navigator.language || "zh-CN"];
  for (const l of list) {
    const n = normalizeLang(l);
    if (I18N[n]) return n;
  }
  return "zh-CN";
}
function setLang(choice) {
  currentLanguage = choice === "auto" ? detectLang() : normalizeLang(choice);
  document.documentElement.lang = currentLanguage;
  try { localStorage.setItem("wqj-lang", choice); } catch(e){}
  $("#languageSelect").value = choice;
  // 更新分类文字
  document.querySelectorAll(".cat").forEach(btn => {
    const key = btn.dataset.category;
    btn.textContent = t(key);
  });
  $("#searchInput").placeholder = t("search");
  $("#empty").textContent = t("empty");
  $(".big-dl").textContent = t("big");
  $(".bottom-tip").textContent = t("tip");
  $("#onlineCount").textContent = t("online") + "14,340";
  render();
}

function visible() {
  const q = $("#searchInput").value.trim().toLowerCase();
  return VIDEO_LIBRARY.filter(v => {
    const catOk = currentCategory === "all" || v.category === currentCategory;
    const text = (loc(v.title) + " " + v.category).toLowerCase();
    return catOk && text.includes(q);
  });
}

function createCard(v) {
  const title = loc(v.title);
  const cover = v.cover || "";
  return `
  <article class="card" data-id="${v.id}">
    <div class="cover">
      ${cover ? `<img src="${cover}" alt="${title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="cover-placeholder" style="display:none">无封面</div>` : `<div class="cover-placeholder">无封面</div>`}
      ${v.live ? `<div class="live-badge"><div class="live-dot"></div>LIVE</div>` : ""}
      <div class="duration">${v.duration || ""}</div>
    </div>
    <div class="card-info">
      <h3>${title}</h3>
      <div class="card-meta">
        <span>👁 ${v.views || "0"}</span>
        <button class="dl-btn" data-id="${v.id}">${t("dl")}</button>
      </div>
    </div>
  </article>`;
}

function render() {
  const list = visible();
  const box = $("#content");
  box.innerHTML = "";
  if (!list.length) {
    $("#empty").style.display = "block";
    return;
  }
  $("#empty").style.display = "none";

  // 按优先级分组，尽量塞满
  const order = [
    {cat: "live", title: t("live")},
    {cat: "ai", title: t("ai")},
    {cat: "anime", title: t("anime")},
    {cat: "other", title: "热门"}
  ];

  order.forEach(g => {
    let items;
    if (currentCategory !== "all") {
      if (g.cat !== currentCategory && !(g.cat === "other" && !["live","ai","anime"].includes(currentCategory))) return;
      items = list;
    } else {
      if (g.cat === "other") {
        items = list.filter(v => !["live","ai","anime"].includes(v.category));
      } else {
        items = list.filter(v => v.category === g.cat);
      }
    }
    if (!items.length) return;

    const sec = document.createElement("div");
    sec.innerHTML = `
      <div class="sec-title">${g.title} <span>${items.length}</span></div>
      <div class="grid">${items.map(createCard).join("")}</div>`;
    box.appendChild(sec);
  });
}

function download(id) {
  if (!DOWNLOAD_API_BASE) {
    alert(currentLanguage.startsWith("zh") ? "请先设置 DOWNLOAD_API_BASE" : "Please set DOWNLOAD_API_BASE");
    return;
  }
  const a = document.createElement("a");
  a.href = DOWNLOAD_API_BASE + encodeURIComponent(id);
  a.target = "_blank";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function openCenter() {
  const list = $("#dlgList");
  list.innerHTML = "";
  VIDEO_LIBRARY.forEach(v => {
    const div = document.createElement("div");
    div.className = "dlg-item";
    div.innerHTML = `<span>${loc(v.title)}</span>`;
    const btn = document.createElement("button");
    btn.textContent = t("dl");
    btn.onclick = () => download(v.id);
    div.appendChild(btn);
    list.appendChild(div);
  });
  $("#dlDialog").showModal();
}

// 事件
$("#content").addEventListener("click", e => {
  const btn = e.target.closest(".dl-btn");
  const card = e.target.closest(".card");
  if (btn) { download(btn.dataset.id); return; }
  if (card) download(card.dataset.id);
});
$("#cats").addEventListener("click", e => {
  const btn = e.target.closest(".cat");
  if (!btn) return;
  currentCategory = btn.dataset.category;
  document.querySelectorAll(".cat").forEach(c => c.classList.toggle("active", c === btn));
  render();
});
$("#searchInput").addEventListener("input", render);
$("#languageSelect").addEventListener("change", e => setLang(e.target.value));
$("#bigDownload").addEventListener("click", openCenter);
$("#closeDlg").addEventListener("click", () => $("#dlDialog").close());
$("#dlDialog").addEventListener("click", e => { if (e.target === $("#dlDialog")) $("#dlDialog").close(); });

// 初始化
let pref = "auto";
try { pref = localStorage.getItem("wqj-lang") || "auto"; } catch(e){}
setLang(pref);

// 模拟在线人数跳动
setInterval(() => {
  const base = 14340;
  const n = base + Math.floor(Math.random() * 80 - 40);
  $("#onlineCount").textContent = t("online") + n.toLocaleString();
}, 4000);
</script>
